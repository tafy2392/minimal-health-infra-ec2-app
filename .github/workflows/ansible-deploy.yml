name: Ansible Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - int
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          echo "$TOKEN" | python3 -c "
          import sys, json, base64
          token = json.load(sys.stdin)['value']
          payload = token.split('.')[1]
          payload += '=' * (4 - len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print('iss:', claims.get('iss'))
          print('sub:', claims.get('sub'))
          print('aud:', claims.get('aud'))
          "

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.ANSIBLE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install Session manager plugin
        uses: ankurk91/install-session-manager-plugin-action@v1
        with:
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Ansible and collections
        run: |
          pip install --upgrade pip ansible
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run deploy playbook
        working-directory: ansible
        run: |
          ansible-playbook \
            -i inventory/${{ inputs.environment || 'dev' }} \
            playbooks/deploy.yml

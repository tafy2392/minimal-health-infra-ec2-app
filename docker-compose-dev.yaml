services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy:1.11.6
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./alb-healthz.conf:/etc/nginx/conf.d/alb-healthz.conf:ro
  app:
    container_name: app
    restart: unless-stopped
    image: ghcr.io/tafy2392/minimal-health-infra-ec2-app:main-db34c8b-224947
    expose:
      - "3000"
    environment:
      APP_SECRET: ${APP_SECRET}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      VIRTUAL_HOST: ${APP_VIRTUAL_HOST:-healthcheck-app.delivery-tst.bmw.cloud}
      VIRTUAL_PORT: "3000"
